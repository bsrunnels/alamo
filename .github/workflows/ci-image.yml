name: Build CI environments

on:
  push:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-environments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Resolve environment changes
    runs-on: ubuntu-24.04
    outputs:
      linux-changed: ${{ steps.changes.outputs.linux-changed }}
      linux-fingerprint: ${{ steps.fingerprint.outputs.linux }}
      macos-changed: ${{ steps.changes.outputs.macos-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fingerprint Linux environment
        id: fingerprint
        shell: bash
        run: |
          set -eu -o pipefail
          fingerprint="$(
            bash .github/containers/ubuntu/environment-fingerprint.sh
          )"
          echo "linux=${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare environment inputs
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/alamo-ci
          LINUX_FINGERPRINT: ${{ steps.fingerprint.outputs.linux }}
        run: |
          set -eu -o pipefail
          if [ "${EVENT_NAME}" = workflow_dispatch ] ||
              [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            linux_changed=true
            macos_changed=true
          else
            linux_changed=false
            for ubuntu in 22.04 24.04; do
              fingerprint_tag="${IMAGE}:ubuntu-${ubuntu}-env-${LINUX_FINGERPRINT}"
              if ! docker buildx imagetools inspect "${fingerprint_tag}" >/dev/null; then
                linux_changed=true
              fi
            done

            if [ "${linux_changed}" = false ]; then
              for ubuntu in 22.04 24.04; do
                fingerprint_tag="${IMAGE}:ubuntu-${ubuntu}-env-${LINUX_FINGERPRINT}"
                stable_tag="${IMAGE}:ubuntu-${ubuntu}"
                docker buildx imagetools create \
                  --tag "${stable_tag}" \
                  "${fingerprint_tag}"
              done
              echo "Promoted existing Linux environment ${LINUX_FINGERPRINT}"
            fi

            if git diff --quiet "${BEFORE}" "${CURRENT}" -- \
                .github/actions/setup-macos \
                .github/environments/macos \
                configure \
                Makefile; then
              macos_changed=false
            else
              macos_changed=true
            fi
          fi
          echo "linux-changed=${linux_changed}" >> "${GITHUB_OUTPUT}"
          echo "macos-changed=${macos_changed}" >> "${GITHUB_OUTPUT}"

  build:
    name: Refresh Ubuntu images
    if: needs.detect.outputs.linux-changed == 'true'
    needs: detect
    uses: ./.github/workflows/build-ci-images.yml
    with:
      environment-fingerprint: ${{ needs.detect.outputs.linux-fingerprint }}
      image: ${{ github.repository_owner }}/alamo-ci
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Refresh macOS environment
    if: needs.detect.outputs.macos-changed == 'true'
    needs: detect
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-macos
