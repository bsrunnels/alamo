name: Master merge

on:
  workflow_run:
    workflows: [Build CI environments]
    types: [in_progress]
    branches: [master]

permissions:
  actions: read
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: master-merge
  cancel-in-progress: false

jobs:
  environment-ready:
    name: Wait for CI environments
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for environment preparation
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = Number('${{ github.event.workflow_run.id }}');
            let previousState = '';
            while (true) {
              const response = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: runId,
              });
              const run = response.data;
              const state = `${run.status}/${run.conclusion ?? '-'}`;
              if (state !== previousState) {
                core.info(`Build CI environments: ${state}`);
                previousState = state;
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(
                    `Build CI environments completed with ${run.conclusion}`
                  );
                }
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

  documentation:
    name: Build release documentation
    needs: environment-ready
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/build-docs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/html

  coverage:
    name: Release coverage
    needs: environment-ready
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cov

  flamegraphs:
    name: Release flame graphs / 2D Clang
    needs: environment-ready
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/regression
        with:
          dimension: "2"
          compiler: clang++
          amrex-variant: 2d-clang++
          configure-flags: --perf
          runtests-flags: --no-coverage --perf
          report-name: flamegraphs-2d-clang
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-flamegraphs-2d-clang
          path: flamegraphs-2d-clang

  assemble-pages:
    name: Assemble master site
    needs: [documentation, coverage, flamegraphs]
    if: >-
      ${{
        always() &&
        needs.documentation.result == 'success' &&
        needs.coverage.result == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: pages-input/docs
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: pages-input/cov
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: pages-input/reports
      - name: Package versioned site
        run: >-
          python3 scripts/package_pages.py
          --slug master
          --docs pages-input/docs
          --coverage pages-input/cov
          --reports pages-input/reports
      - uses: actions/upload-pages-artifact@v3
        with:
          path: githubpages

  deploy-pages:
    name: Publish master site
    needs: assemble-pages
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/master/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify master documentation
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 5
          "${{ steps.deployment.outputs.page_url }}docs/master/"
      - name: Probe retained development documentation
        shell: bash
        run: |
          if ! curl --fail --silent \
              "${{ steps.deployment.outputs.page_url }}docs/development/" >/dev/null; then
            echo "::warning::The development Pages prefix was not retained; persistent site assembly is required."
          fi
