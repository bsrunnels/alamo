name: Master merge

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: master-merge
  cancel-in-progress: false

jobs:
  detect-image-changes:
    name: Detect CI environment changes
    runs-on: ubuntu-24.04
    outputs:
      linux-changed: ${{ steps.changes.outputs.linux-changed }}
      macos-changed: ${{ steps.changes.outputs.macos-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare image inputs
        id: changes
        shell: bash
        run: |
          set -eu -o pipefail
          before="${{ github.event.before }}"
          if [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            linux_changed=true
            macos_changed=true
          else
            if git diff --quiet "${before}" "${{ github.sha }}" -- \
                .github/containers \
                .github/workflows/build-ci-images.yml \
                .github/workflows/dependencies-ubuntu-22.04.sh \
                .github/workflows/dependencies-ubuntu-24.04.sh \
                configure \
                Makefile; then
              linux_changed=false
            else
              linux_changed=true
            fi
            if git diff --quiet "${before}" "${{ github.sha }}" -- \
                .github/actions/setup-macos \
                .github/environments/macos \
                configure \
                Makefile; then
              macos_changed=false
            else
              macos_changed=true
            fi
          fi
          echo "linux-changed=${linux_changed}" >> "${GITHUB_OUTPUT}"
          echo "macos-changed=${macos_changed}" >> "${GITHUB_OUTPUT}"

  build-images:
    name: Refresh Ubuntu images
    needs: detect-image-changes
    uses: ./.github/workflows/build-ci-images.yml
    with:
      enabled: ${{ needs.detect-image-changes.outputs.linux-changed == 'true' }}
      image: ${{ github.repository_owner }}/alamo-ci
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  refresh-macos-environment:
    name: Refresh macOS environment
    needs: detect-image-changes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and cache
        if: needs.detect-image-changes.outputs.macos-changed == 'true'
        uses: ./.github/actions/setup-macos

  documentation:
    name: Build release documentation
    needs: build-images
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-docs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/html

  coverage:
    name: Release coverage
    needs: build-images
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cov

  flamegraphs:
    name: Release flame graphs / 2D Clang
    needs: build-images
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/alamo-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/regression
        with:
          dimension: "2"
          compiler: clang++
          amrex-variant: 2d-clang++
          configure-flags: --perf
          runtests-flags: --no-coverage --perf
          report-name: flamegraphs-2d-clang
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-flamegraphs-2d-clang
          path: flamegraphs-2d-clang

  assemble-pages:
    name: Assemble master site
    needs: [documentation, coverage, flamegraphs]
    if: >-
      ${{
        always() &&
        needs.documentation.result == 'success' &&
        needs.coverage.result == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: pages-input/docs
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: pages-input/cov
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: pages-input/reports
      - name: Package versioned site
        run: >-
          python3 scripts/package_pages.py
          --slug master
          --docs pages-input/docs
          --coverage pages-input/cov
          --reports pages-input/reports
      - uses: actions/upload-pages-artifact@v3
        with:
          path: githubpages

  deploy-pages:
    name: Publish master site
    needs: assemble-pages
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/master/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify master documentation
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 5
          "${{ steps.deployment.outputs.page_url }}docs/master/"
      - name: Probe retained development documentation
        shell: bash
        run: |
          if ! curl --fail --silent \
              "${{ steps.deployment.outputs.page_url }}docs/development/" >/dev/null; then
            echo "::warning::The development Pages prefix was not retained; persistent site assembly is required."
          fi
